<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shader Grimoire - GLSL学習</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        overflow: hidden;
        background: #1a1a2e;
      }
      canvas {
        display: block;
      }
      #help {
        position: fixed;
        top: 16px;
        left: 16px;
        background: rgba(0, 0, 0, 0.5);
        color: #fff;
        padding: 10px 14px;
        border-radius: 6px;
        font-family: monospace;
        font-size: 13px;
        line-height: 1.6;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="help">
      WASD: 移動<br>
      Space: 上昇 / Shift: 下降<br>
      Ctrl: 3倍速<br>
      左クリック+ドラッグ: 視点回転
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
