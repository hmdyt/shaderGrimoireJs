<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shader Grimoire - GLSL学習</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        overflow: hidden;
        background: #1a1a2e;
      }
      canvas {
        display: block;
      }
      #controls {
        position: fixed;
        top: 16px;
        right: 16px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        padding: 12px 16px;
        border-radius: 8px;
        font-family: monospace;
        font-size: 13px;
      }
      #controls label {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #controls input[type="range"] {
        width: 500px;
        height: 12px;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="controls">
      <label>
        Bloom
        <input type="range" id="bloomStrength" min="0" max="30" step="0.1" value="2.0" />
        <span id="bloomValue">2.0</span>
      </label>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
